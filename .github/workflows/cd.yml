
# Name of the github Acrtions and workflow

name: CD
   
    # When should CD run workflow run ?

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed


permissions:
   id-token: write
   contents: read

env:
 AWS_REGION: ap-northeast-1

# Jobs performed by cd workflow

jobs:
   deploy:

   # Runs CD only when CI Succeeds
     if: ${{ github.event.workflow_run.conclusion == 'success' }}


     runs-on: ubuntu-latest


  # Steps perfomed by the CD job
     steps:

    
      #First step: Verify CD Started
      - name : CD started
        run : echo "CI completd. CD workflow started"

           # Get GitHub repository IDs needed for the OIDC trust policy
      - name: Show repository IDs
        run: |
          echo "Owner ID: ${{ github.repository_owner_id }}"
          echo "Repository ID: ${{ github.repository_id }}"

    # fix: checkout commit before docker build

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

       # Configure AWS authentication using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
           role-to-assume: arn:aws:iam::872582135433:role/GitHubActions-CursorRoom-Deploy

      # Verify AWS authentication
      - name: Verify AWS authentication
        run: aws sts get-caller-identity

      # Login to amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

     # Building docker image
      - name: Build Docker image
        run: docker build -t cursor-room:${{ github.event.workflow_run.head_sha }} .

     # Tag docker image
      - name: Tag Docker image
        run: |
          docker tag cursor-room:${{ github.event.workflow_run.head_sha }} \
            ${{ steps.login-ecr.outputs.registry }}/cursor-room:${{ github.event.workflow_run.head_sha }}
      
      # Push image to ECR

      - name: Push Docker image to ECR
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/cursor-room:${{ github.event.workflow_run.head_sha }}