# Name of the GitHub Actions workflow
name: CD

# When should CD run?
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

# Permissions required for GitHub OIDC
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  ECS_CLUSTER: cursor-room-cluster
  ECS_SERVICE: cursor-room-service

# Jobs performed by CD workflow
jobs:
  deploy:

    # Run CD only when CI succeeds
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    # Steps performed by the CD job
    steps:

      # Verify CD started
      - name: CD started
        run: echo "CI completed. CD workflow started"

      # Show GitHub repository IDs
      - name: Show repository IDs
        run: |
          echo "Owner ID: ${{ github.repository_owner_id }}"
          echo "Repository ID: ${{ github.repository_id }}"

      # Checkout the exact commit that triggered CI
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Configure AWS authentication using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::872582135433:role/GitHubActions-CursorRoom-Deploy
          aws-region: ${{ env.AWS_REGION }}

      # Verify AWS authentication
      - name: Verify AWS authentication
        run: aws sts get-caller-identity

      # Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build Docker image
      # Pass the ALB API URL to Vite during the React build
      - name: Build Docker image
        run: |
          docker build \
            --build-arg VITE_API_URL=http://cursor-room-alb-1274414078.ap-northeast-1.elb.amazonaws.com/api \
            -t cursor-room:${{ github.event.workflow_run.head_sha }} .

      # Tag Docker image for ECR
      - name: Tag Docker image
        run: |
          docker tag cursor-room:${{ github.event.workflow_run.head_sha }} \
            ${{ steps.login-ecr.outputs.registry }}/cursor-room:${{ github.event.workflow_run.head_sha }}

      # Push Docker image to ECR
      - name: Push Docker image to ECR
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/cursor-room:${{ github.event.workflow_run.head_sha }}

      # Render the ECS task definition
      # This replaces the PLACEHOLDER image and injects the GitHub secrets.
      - name: Render ECS task definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ecs-task-definition.json
          container-name: cursor-room
          image: ${{ steps.login-ecr.outputs.registry }}/cursor-room:${{ github.event.workflow_run.head_sha }}
          environment-variables: |
            MONGO_URI=${{ secrets.MONGO_URI }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}

      # Deploy the rendered task definition to ECS
      # ECS deployment configuration
      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true